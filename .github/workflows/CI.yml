name: Scala CI

on:
  push:
    branches:
        - "**"
  # Kept for the other workflows that dispatch CI explicitly (e.g. showUpdate.yml).
  workflow_dispatch:

jobs:
  alliumSpecs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Cache the allium CLI
      id: allium-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/allium
        key: allium-cli-3.7.2
    - name: Install the allium CLI
      if: steps.allium-cache.outputs.cache-hit != 'true'
      run: cargo install allium-cli --version 3.7.2 --locked
    - name: Check the behavior specs
      run: sh scripts/checkSpecs.sh
  typescriptCode:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Check Typescript Formatting, Linting & compile
      run: |
        cd filesCheck/
        npm install # Compile included here
        npm run check # Formatting and Compiling
    - name: Run TypeScript tests
      run: |
        cd filesCheck/
        npm run test
  # Each Scala job can be re-run on its own ("Re-run failed jobs"): a flaky one doesn't redo the others.
  scalaCheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-scala
    - name: Test the health probe script
      run: sh scripts/healthProbeTest.sh
    - name: Check Scala Formatting, JSONs Validity, Explicit Dependencies, Instructions
      run: |
        echo this workflow was triggered by ${{github.actor}}
        sbt "check; checkInstructions"
  scalaUnitTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-scala
    - name: Unit tests with coverage
      # Read-only verification: no generators here. `sbt fix` is a local, mutating command that
      # regenerates triggers/calendars/instructions; CI only verifies the checked-in result.
      run: sbt "dbSetup; coverage; test; coverageAggregate; coverageOff"
  scalaIntegrationTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-scala
    - name: Integration tests
      # Live-network Dropbox/Mega tests carry the LiveNetwork tag and are excluded here.
      run: sbt "dbSetup; integration/mUnitTests"
  scalaAssembly:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-scala
    - name: Assembly
      run: sbt assembly
  dbMigration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-scala
    - name: Generate the DB
      run: sbt dbSetup
    - name: Check the production DB migration (DBMigration.sql + updateProdDB.sh)
      run: sh scripts/checkDBMigration.sh botDB.sqlite3
