# -----------------------------------------------------------------------------
# Modifications to this file must be done carefully. The new-bot process
# (sbt newBot) appends a printf line for each new bot's token. When editing
# the "Set Secrets & Run Assembly" step, keep the same structure so adding
# future bots continues to work. See docs/adding-a-bot.md.
# -----------------------------------------------------------------------------

name: Deploy

on:
  workflow_run:
    workflows: ["Scala CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      WEBHOOK_PUBLIC_HOST: ${{ vars.WEBHOOK_PUBLIC_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      TELEGRAM_OPS_CHAT_ID: ${{ vars.TELEGRAM_OPS_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "sbt"
      - name: Install Sbt
        uses: sbt/setup-sbt@v1
      - name: Set Secrets & Run Assembly
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          test -n "$TELEGRAM_OPS_CHAT_ID" || { echo "::error::Set the repository variable TELEGRAM_OPS_CHAT_ID (ops chat id)"; exit 1; }
          test -n "$HEALTHCHECK_PING_URL" || { echo "::error::Set the repository secret HEALTHCHECK_PING_URL (Healthchecks.io ping url)"; exit 1; }
          sed -i "s|^\( *ops-chat-id = \)0\$|\1$TELEGRAM_OPS_CHAT_ID|" /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          sed -i "s|endpoint = \"https://hc-ping.com/placeholder\"|endpoint = \"$HEALTHCHECK_PING_URL\"|" /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          sed -i 's!\"\.\./botDB\.sqlite3"!\"botDB\.sqlite3\"!g' /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          sed -i '0,/webhook-base-url = ".*"/s//webhook-base-url = "https:\/\/'"${{ env.WEBHOOK_PUBLIC_HOST }}"':443"/' /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          cat /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          printf '${{ secrets.ABAR_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/ABarberoBot/src/main/resources/abar_ABarberoBot.token
          printf '${{ secrets.ABAR_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/ABarberoBot/src/main/resources/abar_ABarberoBot_discord.token
          printf '${{ secrets.CALA_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/CalandroBot/src/main/resources/cala_CalandroBot.token
          printf '${{ secrets.MOS_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/M0sconiBot/src/main/resources/mos_M0sconiBot.token
          printf '${{ secrets.MOS_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/M0sconiBot/src/main/resources/mos_M0sconiBot_discord.token
          printf '${{ secrets.RPHJB_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/RichardPHJBensonBot/src/main/resources/rphjb_RichardPHJBensonBot.token
          printf '${{ secrets.RPHJB_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/RichardPHJBensonBot/src/main/resources/rphjb_RichardPHJBensonBot_discord.token
          printf '${{ secrets.XAH_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/XahLeeBot/src/main/resources/xah_XahLeeBot.token
          printf '${{ secrets.XAH_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/XahLeeBot/src/main/resources/xah_XahLeeBot_discord.token
          printf '${{ secrets.YTAI_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/YouTuboAncheI0Bot/src/main/resources/ytai_YouTuboAncheI0Bot.token
          printf '${{ secrets.YTAI_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/YouTuboAncheI0Bot/src/main/resources/ytai_YouTuboAncheI0Bot_discord.token
          printf '${{ secrets.PINO_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/PinoScottoBot/src/main/resources/pino_PinoScottoBot.token
          printf '${{ secrets.PINO_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/PinoScottoBot/src/main/resources/pino_PinoScottoBot_discord.token
          printf '${{ secrets.ORL_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/Alessandro0rlandoBot/src/main/resources/orl_Alessandro0rlandoBot.token
          printf '${{ secrets.ORL_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/Alessandro0rlandoBot/src/main/resources/orl_Alessandro0rlandoBot_discord.token
          printf '${{ secrets.SGAR_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/VittorioSgarbiBot/src/main/resources/sgar_VittorioSgarbiBot.token
          printf '${{ secrets.SGAR_DISCORD_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/VittorioSgarbiBot/src/main/resources/sgar_VittorioSgarbiBot_discord.token
          sbt "dbSetup; assembly"
      - name: Create SSH key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
      - name: Check Java & Install it on Server
        run: |
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'if ! java --version >/dev/null 2>&1; then echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S apk add --no-cache openjdk21-jre; fi'"
      - name: Install Sqlite on Server
        run: |
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S apk add --no-cache sqlite rsync'"
      - name: Install Log Rotation on Server
        run: |
          cat > /tmp/sbots-logrotate <<EOF
          ${{ env.DEPLOY_DIR }}/sbots.log ${{ env.DEPLOY_DIR }}/sbots.err.log ${{ env.DEPLOY_DIR }}/log.txt {
              size 20M
              rotate 5
              copytruncate
              compress
              delaycompress
              missingok
              notifempty
          }
          EOF
          cat > /tmp/sbots-logrotate-cron <<'EOF'
          #!/bin/sh
          exec /usr/sbin/logrotate -s /var/lib/logrotate-sbots.status /etc/logrotate.d/sbots
          EOF
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' /tmp/sbots-logrotate /tmp/sbots-logrotate-cron ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S sh -c \"apk add --no-cache logrotate && install -m 644 /tmp/sbots-logrotate /etc/logrotate.d/sbots && install -m 755 /tmp/sbots-logrotate-cron /etc/periodic/hourly/sbots-logrotate && (rc-update add crond default || true) && (rc-service crond start || true) && logrotate -d /etc/logrotate.d/sbots\"'"
      - name: Ensure Deploy Directory
        run: |
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -c 'mkdir -p ${{ env.DEPLOY_DIR }}'"
      - name: Stop Current bots
        # The service is supervised (respawn): stop it first, a plain killall would be undone after respawn_delay.
        run: ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'java --version; echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S rc-service sbots stop || true; killall java || true'"
      - name: Replace Bot's Jar
        run: |
          JAR_CANDIDATES=(/home/runner/work/sBots/sBots/target/out/jvm/scala-*/main/main.jar)
          if [ ! -f "${JAR_CANDIDATES[0]}" ]; then
            echo "Assembly jar not found under target/out/jvm/scala-*/main/main.jar"
            exit 1
          fi
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' "${JAR_CANDIDATES[0]}" ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/main.jar
      - name: Replace Migration DB Scripts
        run: |
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' /home/runner/work/sBots/sBots/DBMigration.sql /home/runner/work/sBots/sBots/scripts/updateProdDB.sh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/
      - name: Update DB
        # updateProdDB.sh migrates the production data and restores the production DB if the migration fails
        run: |
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' /home/runner/work/sBots/sBots/botDB.sqlite3 ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/botDBBase.sqlite3
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh ${{ env.DEPLOY_DIR }}/updateProdDB.sh ${{ env.DEPLOY_DIR }}"
      - name: Install & Enable Bots Service
        env:
          # LOKI_URL and LOKI_USER are repository variables (not sensitive), only the token is a secret
          LOKI_URL: ${{ vars.LOKI_URL }}
          LOKI_USER: ${{ vars.LOKI_USER }}
          LOKI_TOKEN: ${{ secrets.LOKI_TOKEN }}
        run: |
          # Log shipping to Grafana Cloud Loki is enabled only when all the credentials are set (see logback-main.xml)
          loki_env=""
          # Grafana shows the base url of the stack: the push endpoint is appended unless it is already there
          case "$LOKI_URL" in */loki/api/*) ;; ?*) LOKI_URL="${LOKI_URL%/}/loki/api/v1/push" ;; esac
          if [ -n "$LOKI_URL" ] && [ -n "$LOKI_USER" ] && [ -n "$LOKI_TOKEN" ]; then
            loki_env="export LOG_EXTRA='logback-loki.xml'
          export LOKI_URL='$LOKI_URL'
          export LOKI_USER='$LOKI_USER'
          export LOKI_TOKEN='$LOKI_TOKEN'"
          fi
          cat > /tmp/sbots-openrc <<EOF
          #!/sbin/openrc-run
          name="sBots"
          supervisor=supervise-daemon
          command="/usr/bin/java"
          command_args="-Xms64m -Xmx256m -Xss512k -XX:+UseG1GC -XX:G1PeriodicGCInterval=600000-XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=${{ env.DEPLOY_DIR }}/oom.hprof -Dlogback.configurationFile=logback-main.xml -cp ${{ env.DEPLOY_DIR }}/main.jar com.benkio.main.MainWebhook"
          directory="${{ env.DEPLOY_DIR }}"
          command_user="${{ env.DEPLOY_USER }}"
          pidfile="/run/sbots.pid"
          respawn_delay="5"
          respawn_max="0"
          respawn_period="60"
          output_log="${{ env.DEPLOY_DIR }}/sbots.log"
          error_log="${{ env.DEPLOY_DIR }}/sbots.err.log"

          $loki_env

          depend() {
            need net
          }

          # An old heap dump does not survive a (re)start of the service: the respawn after a crash keeps it.
          start_pre() {
            rm -f "${{ env.DEPLOY_DIR }}/oom.hprof"
          }
          EOF
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' /tmp/sbots-openrc ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/sbots-openrc
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S install -m 700 /tmp/sbots-openrc /etc/init.d/sbots; if ! echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S rc-update show default | grep -Eq \"^[[:space:]]*sbots[[:space:]]*$\"; then echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S rc-update add sbots default; fi'"
      - name: Ask for the post deploy test files
        # One marker per bot: the first start of each bot consumes its own and sends its configured test file to the ops chat (see StartupCheckConfig).
        # The remote command is single-quoted so $bot survives the runner's shell; the touch target is then
        # double-quoted so the remote shell expands it. The old single-quoted target created one file literally
        # named ${bot}_post-deploy-test.marker, so no bot ever found its own marker and no test file was sent.
        run: |
          ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            'rm -f ${{ env.DEPLOY_DIR }}/*_post-deploy-test.marker; for bot in abar cala mos rphjb xah ytai pino orl sgar; do touch "${{ env.DEPLOY_DIR }}/${bot}_post-deploy-test.marker"; done'
      - name: Verify the per-bot markers
        run: |
          count=$(ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "ls -1 ${{ env.DEPLOY_DIR }}/*_post-deploy-test.marker | wc -l")
          if [ "$count" -ne 9 ]; then
            echo "Expected 9 post-deploy markers, found $count"
            exit 1
          fi
      - name: Restart Bots
        run: ssh -p "${{ env.DEPLOY_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S rc-service sbots restart || echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S rc-service sbots start'"
