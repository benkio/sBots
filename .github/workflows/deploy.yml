# -----------------------------------------------------------------------------
# Modifications to this file must be done carefully. The new-bot process
# (sbt newBot) appends a printf line for each new bot's token. When editing
# the "Set Secrets & Run Assembly" step, keep the same structure so adding
# future bots continues to work. See docs/adding-a-bot.md.
# -----------------------------------------------------------------------------

name: Deploy

on:
  workflow_run:
    workflows: ["Scala CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_HOST: corneo.eu
      DEPLOY_USER: benkio
      DEPLOY_DIR: /home/benkio/sBots
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "sbt"
      - name: Install Sbt
        uses: sbt/setup-sbt@v1
      - name: Set Secrets & Run Assembly
        run: |
          sed -i 's!\"\.\./botDB\.sqlite3"!\"botDB\.sqlite3\"!g' /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          cat /home/runner/work/sBots/sBots/modules/main/src/main/resources/application.conf
          printf '${{ secrets.ABAR_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/ABarberoBot/src/main/resources/abar_ABarberoBot.token
          printf '${{ secrets.CALA_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/CalandroBot/src/main/resources/cala_CalandroBot.token
          printf '${{ secrets.MOS_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/M0sconiBot/src/main/resources/mos_M0sconiBot.token
          printf '${{ secrets.RPHJB_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/RichardPHJBensonBot/src/main/resources/rphjb_RichardPHJBensonBot.token
          printf '${{ secrets.XAH_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/XahLeeBot/src/main/resources/xah_XahLeeBot.token
          printf '${{ secrets.YTAI_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/YouTuboAncheI0Bot/src/main/resources/ytai_YouTuboAncheI0Bot.token
          printf '${{ secrets.PINO_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/PinoScottoBot/src/main/resources/pino_PinoScottoBot.token
          printf '${{ secrets.ORL_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/Alessandro0rlandoBot/src/main/resources/orl_Alessandro0rlandoBot.token
          printf '${{ secrets.SGAR_TOKEN }}' > /home/runner/work/sBots/sBots/modules/bots/VittorioSgarbiBot/src/main/resources/sgar_VittorioSgarbiBot.token
          sbt "dbSetup; assembly"
      - name: Create SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
      - name: Check Java & Install it on Server
        run: |
          ssh -o StrictHostKeyChecking=no -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'if ! java --version >/dev/null 2>&1; then echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S apk add --no-cache openjdk21-jre; fi'"
      - name: Install Sqlite on Server
        run: |
          ssh -o StrictHostKeyChecking=no -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -lc 'echo \"${{ secrets.DEPLOY_SUDO_PASSWORD }}\" | sudo -S apk add --no-cache sqlite rsync'"
      - name: Ensure Deploy Directory
        run: |
          ssh -o StrictHostKeyChecking=no -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -c 'mkdir -p ${{ env.DEPLOY_DIR }}'"
      - name: Kill Current bots
        run: ssh -o StrictHostKeyChecking=no -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -c 'java --version; killall java || true'"
      - name: Replace Bot's Jar
        run: rsync -av -e 'ssh -o StrictHostKeyChecking=no' /home/runner/work/sBots/sBots/modules/main/target/scala-3.3.8/main.jar ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/main.jar
      - name: Replace Migration DB Script
        run: rsync -av -e 'ssh -o StrictHostKeyChecking=no' /home/runner/work/sBots/sBots/DBMigration.sql ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/DBMigration.sql
      - name: Update DB
        run: |
          rsync -av -e 'ssh -o StrictHostKeyChecking=no' /home/runner/work/sBots/sBots/botDB.sqlite3 ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/botDBBase.sqlite3
          ssh -o StrictHostKeyChecking=no -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -c 'cd ${{ env.DEPLOY_DIR }}; mv botDB.sqlite3 botDBProdOld.sqlite3; sqlite3 botDBBase.sqlite3 < DBMigration.sql; mv botDBBase.sqlite3 botDB.sqlite3; rm botDBProdOld.sqlite3'"
      - name: Restart Bots
        run: ssh -o StrictHostKeyChecking=no -n "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" "sh -c 'cd ${{ env.DEPLOY_DIR }}; nohup java -cp main.jar com.benkio.main.MainWebhook > /dev/null 2>&1 &'"
