name: Download Prod DB and log files

on:
  workflow_dispatch:
  workflow_call:

jobs:
  download-db:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

    steps:
      - name: Create SSH key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

      - name: Download SQLite DB Prod from VM
        run: |
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/botDB.sqlite3 /home/runner/work/botDB.sqlite3

      - name: Download log file from VM
        run: |
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/log.txt /home/runner/work/log.txt
      - name: Download the service logs from VM
        # --ignore-missing-args: a log that does not exist (yet) is not an error. The logs are the current ones: the rotated
        # files (sbots.log.1, .2.gz, ...) stay on the VM.
        run: |
          mkdir -p /home/runner/work/sbots-logs
          rsync -av --ignore-missing-args -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10' ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/sbots.log ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/sbots.err.log /home/runner/work/sbots-logs/

      - name: Upload DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod sqlite-db
          path: /home/runner/work/botDB.sqlite3

      - name: Upload log file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod logTxt
          path: /home/runner/work/log.txt

      - name: Upload the service logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod sbots logs
          path: /home/runner/work/sbots-logs/
          if-no-files-found: warn
