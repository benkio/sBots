name: Download Prod DB and log file

on:
  workflow_dispatch:

jobs:
  download-db:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

    steps:
      - name: Create SSH key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

      - name: Download SQLite DB Prod from VM
        run: |
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=no' ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/botDB.sqlite3 /home/runner/work/botDB.sqlite3

      - name: Download log file from VM
        run: |
          rsync -av -e 'ssh -p ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=no' ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/log.txt /home/runner/work/log.txt
      - name: Upload DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod sqlite-db
          path: /home/runner/work/botDB.sqlite3

      - name: Upload log file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod logTxt
          path: /home/runner/work/log.txt
