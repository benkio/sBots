name: Refresh Telegram file IDs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the export diff without creating or updating the PR"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  download-db:
    uses: ./.github/workflows/downloadDB.yml
    secrets: inherit

  refresh-file-ids:
    needs: download-db
    runs-on: ubuntu-latest
    steps:
      # A push made with the built-in GITHUB_TOKEN does not trigger the push CI, and the pull_request run of a PR
      # created by GITHUB_TOKEN needs a human approval. When the App credentials are configured, push and PR creation
      # are done as a real GitHub App identity, so CI starts on its own and auto-merge completes with no interaction.
      # Without the credentials this step is skipped and the workflow keeps the previous behaviour.
      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Download production DB
        uses: actions/download-artifact@v4
        with:
          name: prod sqlite-db
          path: .

      - name: Cache Scala CLI dependencies
        uses: coursier/cache-action@v6

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          scala-cli-version: "1.19.0"

      - name: Report what the production DB would change
        # --check exits 1 when there are files to merge: that is the expected result, not a failure.
        continue-on-error: true
        run: scala-cli scripts/ExportFileIds.scala -- --check botDB.sqlite3

      - name: Merge the file references into the bot lists
        if: ${{ !inputs.dry_run }}
        run: scala-cli scripts/ExportFileIds.scala -- --write botDB.sqlite3

      - name: Detect changes
        id: changes
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- modules/bots; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file references to refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the refresh PR
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ -n "$APP_SLUG" ]; then
            git config user.name "$APP_SLUG[bot]"
            git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          added=$(git diff -- modules/bots | grep -c '^+.*"\(telegram\|discord\|irc\|slack\):' || true)
          removed=$(git diff -- modules/bots | grep -c '^-.*"\(telegram\|discord\|irc\|slack\):' || true)

          # A previous refresh PR's head branch survives after the PR is merged. Reusing that name makes
          # `gh pr view` find the merged PR (and edit it instead of opening a new one), and the PR shows
          # references that are already in main. Only an OPEN refresh PR may be reused; otherwise start a
          # fresh branch from the current main so the diff contains only references not merged yet.
          existing_pr=$(
            gh pr list --state open --json number,headRefName \
              --jq 'map(select(.headRefName | startswith("bot/telegram-file-ids"))) | .[0] | select(. != null) | "\(.number) \(.headRefName)"'
          )

          if [ -n "$existing_pr" ]; then
            pr_number=${existing_pr%% *}
            branch=${existing_pr#* }
            echo "Updating open refresh PR #$pr_number on branch $branch"
          else
            branch="bot/telegram-file-ids-${{ github.run_id }}-${{ github.run_attempt }}"
            pr_number=""
            echo "No open refresh PR found; creating a new one on branch $branch"
          fi

          git checkout -B "$branch"
          git add modules/bots
          git commit -m "Refresh file IDs from production DB"
          git push --force origin "$branch"

          body=$(printf '%s\n' \
            'File references captured in production since the last refresh, merged into the per-bot `*_list.json` files.' \
            '' \
            "- Added references: $added" \
            "- Removed references: $removed" \
            '' \
            'Generated by `.github/workflows/fileIds.yml`. References are platform-tagged and stay with their own bot; URLs and other fields are untouched. Please review before merging.')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Refresh Telegram file IDs" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "Refresh Telegram file IDs" --body "$body"
          fi

          # Opening/updating the PR triggers "Scala CI" on the pull_request event, which is the run whose checks
          # GitHub rolls up on the PR. For a PR opened by GITHUB_TOKEN that run waits for one approval from a writer
          # before starting; the checks then report and auto-merge completes once they are green.
          gh pr merge "$branch" --auto --squash
