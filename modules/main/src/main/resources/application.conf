main {
  # The HTTP server of the platforms that receive their messages through it (the Telegram webhook)
  http {
    host-url = "0.0.0.0"
    host-url = ${?HOST_URL}
    port = 8443
    port = ${?PORT}
    keystore-path = ${?KEYSTORE_PATH}
    keystore-password = ${?KEYSTORE_PASSWORD}
  }

  telegram {
    webhook-base-url = "https://129.152.27.196:443"
    webhook-base-url = ${?WEBHOOK_HOST_URL}
    webhook-certificate = ${?WEBHOOK_CERTIFICATE}
    # the chat that gets the notifications of the operators: errors and bots started.
    # 0 is a placeholder: the deploy sets it from the repository variable TELEGRAM_OPS_CHAT_ID
    ops-chat-id = 0
    ops-chat-id = ${?TELEGRAM_OPS_CHAT_ID}
  }

  # The gateway connection of the Discord bots: the tokens are documents of the bots (`<botId>_<botName>_discord.token`)
  discord {
    # how long the connection is given to close before it is closed without waiting for the pending requests
    shutdown-timeout = 10 seconds
    # the privileged message content intent: also enable it in the Discord developer portal, or the connection is refused
    message-content = true
    message-content = ${?DISCORD_MESSAGE_CONTENT}
  }

  # The connection of the IRC bots, one per bot: the nick is the name of the bot, the password of its account (optional) is the
  # document `<botId>_<botName>_irc.token`
  irc {
    host = "irc.libera.chat"
    host = ${?IRC_HOST}
    # the TLS port when tls is true
    port = 6697
    port = ${?IRC_PORT}
    tls = true
    tls = ${?IRC_TLS}
    # the channels every bot joins once connected
    channels = []
    # how long a bot is given to connect and register before it is given up
    ready-timeout = 60 seconds
    shutdown-timeout = 10 seconds
    # the delay before the first reconnection, doubled at every failed attempt, up to the maximum
    reconnect-base-delay = 2 seconds
    reconnect-max-delay = 60 seconds
    # the time between two messages a bot sends (flood protection of the server)
    message-delay = 1200 milliseconds
    # the messages of one sender that a bot handles in the window: the next ones are ignored (flood protection)
    rate-limit-messages = 5
    rate-limit-window = 10 seconds
  }

  healthcheck-ping = {
    # a placeholder: the deploy sets the ping url of the check from the secret HEALTHCHECK_PING_URL
    endpoint = "https://hc-ping.com/placeholder"
    cron = "0 */10 * ? * *"
  }

  # LLM replies: switching provider is a config change, the other provider is always the fallback.
  # The API keys are injected at deploy time from GitHub secrets; see .github/workflows/deploy.yml.
  llm {
    primary-provider = "gemini"
    primary-provider = ${?LLM_PRIMARY_PROVIDER}

    # how long one provider request may take (the fallback has its own budget), and the token limits applied to the prompt
    timeout = 10 seconds
    timeout = ${?LLM_TIMEOUT}
    max-input-tokens = 18432
    max-input-tokens = ${?LLM_MAX_INPUT_TOKENS}
    max-output-tokens = 512
    max-output-tokens = ${?LLM_MAX_OUTPUT_TOKENS}

    # per-chat context window and TTL cleanup (#1489). TTLs below one second are rejected because storage and cutoffs
    # are epoch seconds. The author salt is a secret: there is deliberately no default, so a deployment must set
    # LLM_CONTEXT_AUTHOR_SALT or startup fails. It is redacted from the startup log. Keep it stable across restarts:
    # changing it rotates every anonymous sender label and breaks the remembered conversations.
    context {
      max-messages = 20
      max-messages = ${?LLM_CONTEXT_MAX_MESSAGES}
      max-tokens = 2048
      max-tokens = ${?LLM_CONTEXT_MAX_TOKENS}
      ttl = 7 days
      ttl = ${?LLM_CONTEXT_TTL}
      cleanup-cron = "0 0 * ? * *"
      cleanup-cron = ${?LLM_CONTEXT_CLEANUP_CRON}
      author-salt = ${?LLM_CONTEXT_AUTHOR_SALT}
    }

    # client-side quota per provider, with sliding windows. Defaults mirror the documented free-tier limits:
    # OpenRouter :free is 20 req/min and 50/day without credits; Gemini is provisional pending #1483 measurement.
    # Revisable here or through the env overrides below, without a code change. A fallback call counts against the
    # provider actually called, so each provider can be tuned independently.
    gemini {
      endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
      endpoint = ${?GEMINI_ENDPOINT}
      api-key = ${?GEMINI_API_KEY}
      quota {
        max-per-minute = 20
        max-per-minute = ${?GEMINI_MAX_PER_MINUTE}
        max-per-day = 50
        max-per-day = ${?GEMINI_MAX_PER_DAY}
      }
    }

    openrouter {
      endpoint = "https://openrouter.ai/api/v1/chat/completions"
      endpoint = ${?OPENROUTER_ENDPOINT}
      api-key = ${?OPENROUTER_API_KEY}
      model = "google/gemini-2.5-flash"
      quota {
        max-per-minute = 20
        max-per-minute = ${?OPENROUTER_MAX_PER_MINUTE}
        max-per-day = 50
        max-per-day = ${?OPENROUTER_MAX_PER_DAY}
      }
    }
  }

  main-db = {
    driver = "org.sqlite.JDBC"

    # going back to the root of the project from main/target/scala-2.13/
    # be sure to put here the right path to the db
    db-name = "../botDB.sqlite3"
    db-name = ${?MAIN_DB_NAME}

    url = "jdbc:sqlite:"${main.main-db.db-name}
    url = ${?MAIN_DB_CONNECTION_URL}
  }

  rphjb {
    db = {
      driver = "org.sqlite.JDBC"

      # going back to the root of the project from main/target/scala-2.13/
      # be sure to put here the right path to the db
      db-name = "../botDB.sqlite3"
      db-name = ${?RPHJB_DB_NAME}

      url = "jdbc:sqlite:"${main.rphjb.db.db-name}
      url = ${?RPHJB_DB_CONNECTION_URL}
    }
    request-processing-timeout = 10 seconds
    request-processing-timeout = ${?REQUEST_PROCESSING_TIMEOUT}
    paged-list-text-mode-expiry = 10 minutes
    paged-list-text-mode-max-chats = 100
    subscription-draft-expiry = 10 minutes
    subscription-draft-max-drafts = 100
    # Sent once to the ops chat after a deploy (when the deploy leaves the marker file), like a reply: the slow path of
    # the big media of this bot
    startup-check = {
      test-media = "rphjb_Platinette.mp4"
      test-media = ${?RPHJB_STARTUP_TEST_MEDIA}
    }
    http-cache = {
      dropbox = {
        ttl-seconds = 21600
        ttl-seconds = ${?DROPBOX_HTTP_CACHE_TTL_SECONDS}
        max-size = 20
        max-size = ${?DROPBOX_HTTP_CACHE_MAX_SIZE}
      }
    }
  }

