main {
  # The HTTP server of the platforms that receive their messages through it (the Telegram webhook)
  http {
    host-url = "0.0.0.0"
    host-url = ${?HOST_URL}
    port = 8443
    port = ${?PORT}
    keystore-path = ${?KEYSTORE_PATH}
    keystore-password = ${?KEYSTORE_PASSWORD}
  }

  telegram {
    webhook-base-url = "https://129.152.27.196:443"
    webhook-base-url = ${?WEBHOOK_HOST_URL}
    webhook-certificate = ${?WEBHOOK_CERTIFICATE}
    # the chat that gets the notifications of the operators: errors and bots started
    ops-chat-id = -4145546019
    ops-chat-id = ${?TELEGRAM_OPS_CHAT_ID}
  }

  # The gateway connection of the Discord bots: the tokens are documents of the bots (`<botId>_<botName>_discord.token`)
  discord {
    # how long the connection is given to close before it is closed without waiting for the pending requests
    shutdown-timeout = 10 seconds
    # the privileged message content intent: also enable it in the Discord developer portal, or the connection is refused
    message-content = true
    message-content = ${?DISCORD_MESSAGE_CONTENT}
  }

  # The connection of the IRC bots, one per bot: the nick is the name of the bot, the password of its account (optional) is the
  # document `<botId>_<botName>_irc.token`
  irc {
    host = "irc.libera.chat"
    host = ${?IRC_HOST}
    # the TLS port when tls is true
    port = 6697
    port = ${?IRC_PORT}
    tls = true
    tls = ${?IRC_TLS}
    # the channels every bot joins once connected
    channels = []
    # how long a bot is given to connect and register before it is given up
    ready-timeout = 60 seconds
    shutdown-timeout = 10 seconds
    # the delay before the first reconnection, doubled at every failed attempt, up to the maximum
    reconnect-base-delay = 2 seconds
    reconnect-max-delay = 60 seconds
  }

  healthcheck-ping = {
    # https://healthchecks.io/checks/4221a6b9-6770-4e21-8a05-eddeb583003c/details/
    endpoint = "https://hc-ping.com/4221a6b9-6770-4e21-8a05-eddeb583003c"
    cron = "0 */10 * ? * *"
  }

  main-db = {
    driver = "org.sqlite.JDBC"

    # going back to the root of the project from main/target/scala-2.13/
    # be sure to put here the right path to the db
    db-name = "../botDB.sqlite3"
    db-name = ${?MAIN_DB_NAME}

    url = "jdbc:sqlite:"${main.main-db.db-name}
    url = ${?MAIN_DB_CONNECTION_URL}
  }

  rphjb {
    db = {
      driver = "org.sqlite.JDBC"

      # going back to the root of the project from main/target/scala-2.13/
      # be sure to put here the right path to the db
      db-name = "../botDB.sqlite3"
      db-name = ${?RPHJB_DB_NAME}

      url = "jdbc:sqlite:"${main.rphjb.db.db-name}
      url = ${?RPHJB_DB_CONNECTION_URL}
    }
    http-cache = {
      dropbox = {
        ttl-seconds = 21600
        ttl-seconds = ${?DROPBOX_HTTP_CACHE_TTL_SECONDS}
        max-size = 20
        max-size = ${?DROPBOX_HTTP_CACHE_MAX_SIZE}
      }
      mega = {
        ttl-seconds = 21600
        ttl-seconds = ${?MEGA_HTTP_CACHE_TTL_SECONDS}
        max-size = 20
        max-size = ${?MEGA_HTTP_CACHE_MAX_SIZE}
      }
    }
  }

