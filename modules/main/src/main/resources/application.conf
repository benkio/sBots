main {
  webhook-base-url = "https://129.152.27.196:443"
  webhook-base-url = ${?WEBHOOK_HOST_URL}
  host-url = "0.0.0.0"
  host-url = ${?HOST_URL}
  port = 8443
  port = ${?PORT}
  webhook-certificate = ${?WEBHOOK_CERTIFICATE}
  keystore-path = ${?KEYSTORE_PATH}
  keystore-password = ${?KEYSTORE_PASSWORD}
  healthcheck-ping = {
    # https://healthchecks.io/checks/4221a6b9-6770-4e21-8a05-eddeb583003c/details/
    endpoint = "https://hc-ping.com/4221a6b9-6770-4e21-8a05-eddeb583003c"
    cron = "0 */10 * ? * *"
  }

  main-db = {
    driver = "org.sqlite.JDBC"

    # going back to the root of the project from main/target/scala-2.13/
    # be sure to put here the right path to the db
    db-name = "../botDB.sqlite3"
    db-name = ${?MAIN_DB_NAME}

    url = "jdbc:sqlite:"${main.main-db.db-name}
    url = ${?MAIN_DB_CONNECTION_URL}
  }

  rphjb {
    db = {
      driver = "org.sqlite.JDBC"

      # going back to the root of the project from main/target/scala-2.13/
      # be sure to put here the right path to the db
      db-name = "../botDB.sqlite3"
      db-name = ${?RPHJB_DB_NAME}

      url = "jdbc:sqlite:"${main.rphjb.db.db-name}
      url = ${?RPHJB_DB_CONNECTION_URL}
    }
    http-cache = {
      dropbox = {
        ttl-seconds = 21600
        ttl-seconds = ${?DROPBOX_HTTP_CACHE_TTL_SECONDS}
        max-size = 20
        max-size = ${?DROPBOX_HTTP_CACHE_MAX_SIZE}
      }
      mega = {
        ttl-seconds = 21600
        ttl-seconds = ${?MEGA_HTTP_CACHE_TTL_SECONDS}
        max-size = 20
        max-size = ${?MEGA_HTTP_CACHE_MAX_SIZE}
      }
    }
  }

